name: eval

# Stage 0 of docs/benchmark.md: build the frozen test set and the free baselines.
# Nothing here calls a paid API. The vector baseline runs Jina weights locally.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "census | dataset | baselines | all"
        type: choice
        options: [census, dataset, baselines, all]
        default: census
      size:
        description: "repo size tier"
        type: choice
        options: [all, medium, huge]
        default: medium
      split:
        description: "train / holdout / all — holdout is capped at 5 runs, see benchmark.md"
        type: choice
        options: [train, holdout, all]
        default: train
      limit:
        description: "max queries per repo (0 = no cap)"
        type: string
        default: "25"
      baselines:
        description: "comma separated: grep,bm25,vector"
        type: string
        default: "grep,bm25"
  schedule:
    - cron: "17 4 * * 1"        # weekly census, keeps the supply numbers honest

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  EVAL_CACHE: ${{ github.workspace }}/eval/.cache

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.build.outputs.repos }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        working-directory: eval
        env:
          SIZE: ${{ inputs.size || 'medium' }}
          SPLIT: ${{ inputs.split || 'train' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, ".")
          from harness.common import parse_repos
          size, split = os.environ["SIZE"], os.environ["SPLIT"]
          rows = [r for r in parse_repos()
                  if (size == "all" or r["size"] == size)
                  and (split == "all" or r["split"] == split)]
          print("repos=" + json.dumps([{"repo": r["repo"],
                                        "slug": r["repo"].replace("/", "__"),
                                        "size": r["size"]} for r in rows]))
          PY

  census:
    # 先数再抓：一个仓库到底有多少条满足过滤条件的 PR。规格站不住就别往下走。
    if: ${{ (inputs.stage || 'census') == 'census' || (inputs.stage || 'census') == 'all' }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: count usable PRs
        working-directory: eval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m harness.run census \
            --size "${{ inputs.size || 'all' }}" \
            --split "${{ inputs.split || 'all' }}" | tee census.md
          { echo "### 可用 query 普查"; echo; cat census.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: census
          path: eval/results/census.json

  dataset:
    if: ${{ contains(fromJSON('["dataset","baselines","all"]'), inputs.stage || 'census') }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.repos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq universal-ctags ripgrep
      - name: cache git mirror
        uses: actions/cache@v4
        with:
          path: eval/.cache/mirrors/${{ matrix.target.slug }}.git
          key: mirror-${{ matrix.target.slug }}-${{ github.run_id }}
          restore-keys: mirror-${{ matrix.target.slug }}-
      - name: cache symbol index
        uses: actions/cache@v4
        with:
          path: eval/.cache/tags/${{ matrix.target.slug }}
          key: tags-${{ matrix.target.slug }}-${{ github.run_id }}
          restore-keys: tags-${{ matrix.target.slug }}-
      - name: collect + build
        working-directory: eval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LIMIT="${{ inputs.limit || '25' }}"
          ARGS=""; [ "$LIMIT" != "0" ] && ARGS="--limit $LIMIT"
          python3 -m harness.run collect --repo "${{ matrix.target.repo }}"
          python3 -m harness.run build   --repo "${{ matrix.target.repo }}" $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: dataset-${{ matrix.target.slug }}
          path: eval/datasets/${{ matrix.target.slug }}.jsonl

  baselines:
    if: ${{ contains(fromJSON('["baselines","all"]'), inputs.stage || 'census') }}
    needs: [matrix, dataset]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.repos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq universal-ctags ripgrep
      - uses: actions/download-artifact@v4
        with:
          name: dataset-${{ matrix.target.slug }}
          path: eval/datasets
      - name: cache git mirror
        uses: actions/cache@v4
        with:
          path: eval/.cache/mirrors/${{ matrix.target.slug }}.git
          key: mirror-${{ matrix.target.slug }}-${{ github.run_id }}
          restore-keys: mirror-${{ matrix.target.slug }}-
      - name: cache symbol index
        uses: actions/cache@v4
        with:
          path: eval/.cache/tags/${{ matrix.target.slug }}
          key: tags-${{ matrix.target.slug }}-${{ github.run_id }}
          restore-keys: tags-${{ matrix.target.slug }}-
      - name: cache local embeddings
        if: contains(inputs.baselines || 'grep,bm25', 'vector')
        uses: actions/cache@v4
        with:
          path: eval/.cache/emb/${{ matrix.target.slug }}.sqlite
          key: emb-${{ matrix.target.slug }}-${{ github.run_id }}
          restore-keys: emb-${{ matrix.target.slug }}-
      - name: local Jina weights (no API)
        if: contains(inputs.baselines || 'grep,bm25', 'vector')
        working-directory: eval
        run: pip install -q -r requirements.txt
      - name: free disk for huge repos
        if: matrix.target.size == 'huge'
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - name: run baselines
        working-directory: eval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVAL_VECTOR_MODE: ${{ matrix.target.size == 'huge' && 'pool' || 'full' }}
        run: |
          LIMIT="${{ inputs.limit || '25' }}"
          ARGS=""; [ "$LIMIT" != "0" ] && ARGS="--limit $LIMIT"
          python3 -m harness.run run \
            --repo "${{ matrix.target.repo }}" \
            --baselines "${{ inputs.baselines || 'grep,bm25' }}" $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.target.slug }}
          path: eval/results/${{ matrix.target.slug }}.json

  report:
    if: ${{ always() && contains(fromJSON('["baselines","all"]'), inputs.stage || 'census') }}
    needs: [matrix, baselines]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { pattern: dataset-*, path: eval/dl-datasets, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { pattern: results-*, path: eval/dl-results, merge-multiple: true }
      - name: merge + report
        working-directory: eval
        run: |
          mkdir -p datasets results
          cp -f dl-datasets/*.jsonl datasets/ 2>/dev/null || true
          cp -f dl-results/*.json  results/  2>/dev/null || true
          python3 -m harness.run report \
            --size "${{ inputs.size || 'all' }}" \
            --split "${{ inputs.split || 'all' }}" | tee report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            eval/report.md
            eval/results/report.md
